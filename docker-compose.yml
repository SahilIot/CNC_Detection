services:
  backend:
    build: .
    image: cnc-detection:latest
    working_dir: /app/cnc_backend
    command: uvicorn monitoring.api:app --host 0.0.0.0 --port 9000
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - path: .env
        required: false
      - path: cnc_backend/.env
        required: false
    volumes:
      - ./cnc_backend/models:/app/cnc_backend/models:ro
      - ./cnc_backend/data/outputs:/app/cnc_backend/data/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dashboard:
    build: .
    image: cnc-detection:latest
    working_dir: /app/cnc_frontend
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CNC_BACKEND_URL: http://backend:9000
      CNC_DATABASE_PATH: /data/cnc.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - frontend-data:/data

volumes:
  frontend-data:

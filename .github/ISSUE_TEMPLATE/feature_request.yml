name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What need or problem would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there other approaches or workarounds?
  - type: textarea
    id: safety
    attributes:
      label: Safety and operational impact
      description: Could this affect zone limits, violation timing, camera access, event data, or deployment?
  - type: markdown
    attributes:
      value: |
        Do not include camera credentials, camera footage, database files, or other private site data.

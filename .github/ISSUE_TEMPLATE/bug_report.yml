name: Bug report
description: Report a reproducible problem in CNC Detection.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include camera credentials, RTSP URLs containing secrets, camera footage, database files, or other private site data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Start the backend and dashboard
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Relevant error output
      description: Paste redacted logs or error messages. Remove credentials and private data.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Provide the commit SHA or release/version if known.
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4
  - type: dropdown
    id: service
    attributes:
      label: Affected component
      options:
        - Dashboard frontend
        - Detection backend
        - Camera/NVR connection
        - Installation or deployment
        - Other
    validations:
      required: true
